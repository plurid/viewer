name: Source checks and dependency advisories
on:
  pull_request:
    paths:
      - 'packages/viewer-electron/app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/source-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VIEWER_TEST_PRESERVE: '1'
      VIEWER_TEST_NO_REMOVAL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - name: Source policy and build-path regressions
        run: pnpm --filter viewer-electron exec vitest run tests/code-quality-rules.test.ts tests/processor-paths.test.ts tests/macos-build-target.test.ts
