name: Documentation
on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - 'docs/media/**'
      - 'packages/viewer-electron/app/tools/docs/**'
      - 'packages/viewer-electron/app/tests/docs.test.ts'
      - 'package.json'
      - 'packages/viewer-electron/app/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/media/**'
      - 'packages/viewer-electron/app/tools/docs/**'
      - 'packages/viewer-electron/app/tests/docs.test.ts'
      - 'package.json'
      - 'packages/viewer-electron/app/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIEWER_TEST_PRESERVE: '1'
      VIEWER_TEST_NO_REMOVAL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter viewer-electron exec vitest run tests/docs.test.ts
      - run: pnpm docs:check
