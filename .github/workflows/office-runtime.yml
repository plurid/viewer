name: Office runtime on desktop platforms
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/viewer-electron/app/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/office-runtime.yml'
permissions:
  contents: read
jobs:
  office:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/viewer-electron/app
    env:
      VIEWER_TEST_PRESERVE: '1'
      VIEWER_TEST_NO_REMOVAL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec tsc -p tsconfig.main.json
      - run: pnpm exec tsc -p tsconfig.renderer.json
      - name: Real bundled conversion on macOS and Windows
        if: runner.os != 'Linux'
        run: node --import tsx tools/office-engine-smoke.ts
      - name: Real bundled conversion on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node --import tsx tools/office-engine-smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: office-runtime-${{ runner.os }}
          include-hidden-files: true
          path: |
            packages/viewer-electron/app/out/viewer-office-engine-smoke-*
            packages/viewer-electron/app/assets/viewer-office-v1
